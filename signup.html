<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Inscription - Mon Petit Pays</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="Styles/style.css" />
  <link rel="stylesheet" href="Styles/colors.css" />
</head>
<body>
<div id="header-placeholder"></div>
<script>
  fetch('header.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('header-placeholder').innerHTML = html;
    });
</script>
  <main>
    <div id="signup-container">
      <h2>Créer un compte</h2>
      <form id="signup-form">
        <input type="email" id="signup-email" placeholder="Votre email" required />
        <input type="password" id="signup-password" placeholder="Votre mot de passe" required />
        <button type="submit" id="submit">S'inscrire</button>
      </form>
      <div>
        <a href="index.html">Déjà un compte ? Connectez-vous</a>
      </div>
    </div>
  </main>
  <script type="module" src="signup.js"></script>
  <script type="module" src="main.js"></script>
  <script type="module" src="header.js"></script>       <!-- Gestion de l'en-tête -->
</body>
</html>
