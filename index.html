<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mon Petit Pays</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="Styles/style.css" />
  <link rel="stylesheet" href="Styles/colors.css" />
</head>
<body>
<div id="header-placeholder"></div>
<script>
  fetch('header.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('header-placeholder').innerHTML = html;
    });
</script>
  <main>
    <div id="map-panel">
      <div id="map"></div>
      <div id="info-commune">
        <div id="info-commune_header">
          <label id="info-nom"></label>
          <label id="info-code-postale"></label>
          <input type="checkbox" id="info-commune_visited" />
          <button id="info-commune_close">X</button>
        </div>
        <label id="info-commune_detaillé">
          <label id="info-commune-catégorie">
            Catégorie :
            <select id="visit-status">
              <option value="Non visité">Non visité</option>
              <option value="Visité">Visité</option>
              <option value="Passé">Passé par</option>
             <option value="Habité">Habitait dans</option>
            </select>
          </label>
          <label id="info-commune-date-visite"> 
            Date : 
             <input type="date" id="input-date" style="display: inline;" />
          </label>
          <label>Mode de Transport : <span id="info-transport"> Non défini</span></label>
        </label>
      </div>
    </div>

    <div id="mycommune-list-panel">
      <div id=" mycommune-list-panel__header">
        <input type="text" id="mycommune-search" placeholder="Mes communes" />
        <button id="new-commune-research-button">+</button>
      </div>
      <div id="mycommune-list"></div>
    </div>

    <div id="allcommune-list-panel">
      <button id="all-commune-close-button">X</button>
      <div id=" allcommune-list-panel__header">
        <input type="text" id="allcommune-search" placeholder="Rechercher une commune..." />
      </div>
      <div id="allcommune-list"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>     <!-- Bibliothèque Leaflet -->  
  <script type="module" src="main.js"></script>      <!-- Fichier JS principal -->
  <script type="module" src="header.js"></script>       <!-- Gestion de l'en-tête -->
</body>
</html>
