<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Carte des communes</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style> #map { height: 100vh; } </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([46.5, 2.5], 6); // Vue centrée sur la France
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/">Carto</a>',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    fetch('Assets/GeoJson/communes.geojson')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          style: feature => ({
            color: '#333',
            fillColor: '#ccc',
            fillOpacity: 0.7,
            weight: 0.5
          }),
          onEachFeature: (feature, layer) => {
            layer.on('click', () => {
              layer.setStyle({ fillColor: 'red' });
              console.log("Commune visitée :", feature.properties.nom);
            });
